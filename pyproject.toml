[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-air"
version = "2.0.0"
description = "Radar-infrared multimodal target classification competition pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "joblib>=1.4,<2",
  "mat-io>=0.16",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pandas>=2.2,<3",
  "py7zr>=0.22,<1",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
  "tqdm>=4.66,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
anti-air = "anti_air.cli:main"

[tool.setuptools.packages.find]
include = ["anti_air*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
