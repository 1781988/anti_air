[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-air"
version = "0.1.0"
description = "Radar-infrared multimodal target classification baseline for complex low-altitude environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "mat-io",
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.10,<5",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.15,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["anti_air*"]
