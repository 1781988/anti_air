[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anti-air"
version = "1.1.0"
description = "End-to-end radar-infrared multimodal target classification for complex low-altitude environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "joblib>=1.4,<2",
  "mat-io",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pandas>=2.2,<3",
  "py7zr>=0.22,<1",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
anti-air-train = "train:main"
anti-air-infer = "infer:main"
anti-air-evaluate = "evaluate:main"
anti-air-extract = "extract_features:main"

[tool.setuptools]
py-modules = ["train", "infer", "evaluate", "extract_features"]

[tool.setuptools.packages.find]
include = ["anti_air*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
