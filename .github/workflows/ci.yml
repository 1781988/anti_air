name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: anti-air
          environment-file: environment.yml
          auto-activate-base: false
      - shell: bash -el {0}
        run: python -m pip install -e ".[dev]"
      - shell: bash -el {0}
        run: python -m compileall -q anti_air main.py
      - shell: bash -el {0}
        run: python -m pytest
